<!DOCTYPE html>
<html>
<head>
  <title>Tempo Pay USDC</title>
</head>

<body style="font-family: Arial; padding: 40px;">

  <h1>Tempo Pay 💸</h1>

  <p id="info"></p>

  <button onclick="pay()">Pay USDC</button>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.0/dist/ethers.umd.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const to = params.get("to");
    const amount = params.get("amount");

    document.getElementById("info").innerText =
      `Send ${amount} USDC to ${to}`;

    const USDC_CONTRACT = "0x20c000000000000000000000b9537d11c60e8b50";

    const ABI = [
      "function transfer(address to, uint amount) returns (bool)"
    ];

    async function pay() {
      if (!window.ethereum) {
        alert("Install MetaMask");
        return;
      }

      const provider = new ethers.BrowserProvider(window.ethereum);
      const signer = await provider.getSigner();

      const contract = new ethers.Contract(USDC_CONTRACT, ABI, signer);

      const value = ethers.parseUnits(amount, 6);

      const tx = await contract.transfer(to, value);

      await tx.wait();

      alert("Payment successful!");
    }
  </script>

</body>
</html>
