<!DOCTYPE html>
<html>
<head>
  <title>Tempo USDC Pay</title>
</head>

<body style="font-family: Arial; padding: 40px;">

  <h1>Tempo USDC Pay 💸</h1>

  <p id="info">Loading payment...</p>

  <button onclick="pay()">Pay in USDC</button>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.0/dist/ethers.umd.min.js"></script>

  <script>
    // =========================
    // URL PARAMS
    // =========================
    const params = new URLSearchParams(window.location.search);

    const to = (params.get("to") || "").trim();
    const amount = (params.get("amount") || "").trim();

    const info = document.getElementById("info");

    if (!to || !amount) {
      info.innerText = "❌ Missing 'to' or 'amount' in URL";
    } else {
      info.innerText = `Send ${amount} USDC to ${to}`;
    }

    // =========================
    // TEMPO NETWORK
    // =========================
    const TEMPO_CHAIN_ID = "0x1079";

    // =========================
    // YOUR USDC CONTRACT (Tempo)
    // =========================
    const USDC_ADDRESS = "0x20c000000000000000000000b9537d11c60e8b50";

    // minimal ERC20 ABI
    const ERC20_ABI = [
      "function transfer(address to, uint amount) returns (bool)",
      "function decimals() view returns (uint8)"
    ];

    // =========================
    // NETWORK CHECK
    // =========================
    async function ensureTempoNetwork() {
      const chainId = await window.ethereum.request({
        method: "eth_chainId"
      });

      if (chainId !== TEMPO_CHAIN_ID) {
        try {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: TEMPO_CHAIN_ID }]
          });
        } catch (err) {
          throw new Error("WRONG_NETWORK");
        }
      }
    }

    // =========================
    // PAYMENT
    // =========================
    async function pay() {
      try {

        if (!window.ethereum) {
          alert("Install MetaMask");
          return;
        }

        if (!to || !amount) {
          alert("Invalid payment link");
          return;
        }

        // 1. ensure Tempo network
        await ensureTempoNetwork();

        // 2. connect wallet
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = await provider.getSigner();

        // 3. USDC contract
        const usdc = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);

        // 4. decimals (USDC usually = 6)
        const decimals = await usdc.decimals();

        const value = ethers.parseUnits(amount, decimals);

        // 5. transfer USDC
        const tx = await usdc.transfer(to, value);

        info.innerText = "⏳ Sending USDC...";

        await tx.wait();

        info.innerText = "✅ Payment successful!";
        alert("USDC sent successfully!");

      } catch (err) {

        console.error(err);

        if (err.message === "WRONG_NETWORK") {
          alert("❌ Switch to Tempo network in MetaMask");
          return;
        }

        alert("❌ Transaction failed (check console)");
      }
    }
  </script>

</body>
</html>
