<!DOCTYPE html>
<html>
<head>
  <title>Tempo Pay</title>
</head>

<body style="font-family: Arial; padding: 40px;">

  <h1>Tempo Pay 💸</h1>

  <p id="info">Loading...</p>

  <button onclick="pay()">Pay</button>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.0/dist/ethers.umd.min.js"></script>

  <script>
    // =========================
    // GET PARAMETERS
    // =========================
    const params = new URLSearchParams(window.location.search);
    const to = (params.get("to") || "").trim();
    const amount = (params.get("amount") || "").trim();

    const info = document.getElementById("info");

    if (!to || !amount) {
      info.innerText = "❌ Invalid link (missing to or amount)";
    } else {
      info.innerText = `Send ${amount} T to ${to}`;
    }

    // =========================
    // TEMPO NETWORK CONFIG
    // =========================
    const TEMPO_CHAIN_ID = "0x1079"; // 4217 in hex

    // =========================
    // CHECK NETWORK
    // =========================
    async function ensureTempoNetwork() {
      const currentChainId = await window.ethereum.request({
        method: "eth_chainId"
      });

      if (currentChainId === TEMPO_CHAIN_ID) {
        return true;
      }

      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: TEMPO_CHAIN_ID }]
        });
      } catch (err) {
        throw new Error("NOT_TEMPO_NETWORK");
      }
    }

    // =========================
    // PAY FUNCTION
    // =========================
    async function pay() {
      try {

        if (!window.ethereum) {
          alert("Install MetaMask");
          return;
        }

        if (!to || !amount) {
          alert("Invalid payment link");
          return;
        }

        // 🔥 строго проверяем сеть
        await ensureTempoNetwork();

        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = await provider.getSigner();

        const tx = await signer.sendTransaction({
          to: to,
          value: ethers.parseEther(amount)
        });

        info.innerText = "⏳ Transaction pending...";

        await tx.wait();

        info.innerText = "✅ Payment successful!";
        alert("Payment successful!");

      } catch (err) {

        if (err.message === "NOT_TEMPO_NETWORK") {
          alert("❌ Please switch to Tempo network in MetaMask");
          return;
        }

        console.error(err);
        alert("❌ Transaction failed. Check console (F12)");
      }
    }
  </script>

</body>
</html>
