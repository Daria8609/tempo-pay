<!DOCTYPE html>
<html>
<head>
  <title>Tempo Pay (Viem Style)</title>
</head>

<body style="font-family: Arial; padding: 40px;">

  <h1>Tempo Pay 💸</h1>

  <p id="info">Loading...</p>

  <button onclick="pay()">Pay USDC</button>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.0/dist/ethers.umd.min.js"></script>

  <script>
    // =========================
    // PARAMS
    // =========================
    const params = new URLSearchParams(window.location.search);

    const to = (params.get("to") || "").trim();
    const amount = (params.get("amount") || "").trim();

    const info = document.getElementById("info");

    if (!to || !amount) {
      info.innerText = "❌ Missing to or amount";
    } else {
      info.innerText = `Send ${amount} USDC to ${to}`;
    }

    // =========================
    // TEMPO
    // =========================
    const TEMPO_CHAIN_ID = "0x1079";

    // USDC contract (твоя)
    const USDC_ADDRESS = "0x20c000000000000000000000b9537d11c60e8b50";

    // минимальный ABI encode (transfer)
    const ERC20_IFACE = new ethers.Interface([
      "function transfer(address to, uint amount)"
    ]);

    async function ensureTempo() {
      const chainId = await window.ethereum.request({
        method: "eth_chainId"
      });

      if (chainId !== TEMPO_CHAIN_ID) {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: TEMPO_CHAIN_ID }]
        });
      }
    }

    // =========================
    // PAY (TEMPO STYLE)
    // =========================
    async function pay() {
      try {

        if (!window.ethereum) {
          alert("Install MetaMask");
          return;
        }

        if (!to || !amount) {
          alert("Invalid link");
          return;
        }

        await ensureTempo();

        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = await provider.getSigner();

        // USDC decimals (обычно 6)
        const decimals = 6;

        const value = ethers.parseUnits(amount, decimals);

        // encode call data (ВАЖНО для Tempo)
        const data = ERC20_IFACE.encodeFunctionData("transfer", [
          to,
          value
        ]);

        // ⚡ ВАЖНО: НЕТ value, только data
        const tx = await signer.sendTransaction({
          to: USDC_ADDRESS,
          data: data,
          gasLimit: 200000
        });

        info.innerText = "⏳ Sending USDC...";

        await tx.wait();

        info.innerText = "✅ Paid successfully!";
        alert("USDC sent!");

      } catch (err) {
        console.error(err);
        alert("❌ Failed (check console)");
      }
    }
  </script>

</body>
</html>
