<!DOCTYPE html>
<html>
<head>
  <title>Tempo Pay</title>
</head>

<body style="font-family: Arial; padding: 40px;">

  <h1>Tempo Pay 💸</h1>

  <p id="info">Loading...</p>

  <button onclick="pay()">Pay</button>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.0/dist/ethers.umd.min.js"></script>

  <script>
    // =========================
    // GET DATA FROM URL
    // =========================
    const params = new URLSearchParams(window.location.search);

    const to = (params.get("to") || "").trim();
    const amount = (params.get("amount") || "").trim();

    const info = document.getElementById("info");

    if (!to || !amount) {
      info.innerText = "❌ Missing 'to' or 'amount' in URL";
    } else {
      info.innerText = `Send ${amount} T to ${to}`;
    }

    // =========================
    // TEMPO CHAIN
    // =========================
    const TEMPO_CHAIN_ID = "0x1079";

    async function ensureTempoNetwork() {
      const chainId = await window.ethereum.request({
        method: "eth_chainId"
      });

      if (chainId !== TEMPO_CHAIN_ID) {
        try {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: TEMPO_CHAIN_ID }]
          });
        } catch (err) {
          throw new Error("WRONG_NETWORK");
        }
      }
    }

    // =========================
    // PAY FUNCTION
    // =========================
    async function pay() {
      try {

        if (!window.ethereum) {
          alert("Install MetaMask");
          return;
        }

        if (!to || !amount) {
          alert("Invalid link");
          return;
        }

        // 1. проверяем сеть
        await ensureTempoNetwork();

        // 2. подключаем кошелёк
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = await provider.getSigner();

        // 3. отправка транзакции (ВАЖНО: фикс gasLimit)
        const tx = await signer.sendTransaction({
          to: to,
          value: ethers.parseEther(amount),
          gasLimit: 21000
        });

        info.innerText = "⏳ Transaction pending...";

        await tx.wait();

        info.innerText = "✅ Payment successful!";
        alert("Payment successful!");

      } catch (err) {

        console.error(err);

        if (err.message === "WRONG_NETWORK") {
          alert("❌ Switch to Tempo network in MetaMask");
          return;
        }

        alert("❌ Transaction failed (check console)");
      }
    }
  </script>

</body>
</html>
